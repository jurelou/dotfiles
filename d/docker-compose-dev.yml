---
volumes:
  cpp-data:


x-defaults: &defaults
  restart: unless-stopped

services:
  frontend:
    <<: *defaults
    container_name: frontend
    image: cpp-frontend-dev
    build:
      context: ./frontend
      target: development
    ports:
      - 9200:9200
      - 443:443
    develop:
      # https://docs.docker.com/compose/file-watch/#compose-watch-versus-bind-mounts
      watch:
        - action: sync
          path: ./frontend
          target: /src
          ignore:
            - node_modules
            - dist
            - frontend/node_modules
            - frontend/dist
        # Rebuild the image if dependencies change by checking uv.lock
        - action: rebuild
          path: ./uv.lock
    command: /bin/sh -c "npm run dev"
  
  backend:
    <<: *defaults
    container_name: backend
    image: cpp-backend-dev
    build:
      context: ./backend
      target: development
    # Include development dependencies when working locally
    environment:
      - UV_NO_DEV=0
    ports:
      - 8000:8000
    develop:
      # https://docs.docker.com/compose/file-watch/#compose-watch-versus-bind-mounts
      watch:
        - action: sync
          path: ./backend
          target: /src
          ignore:
            - .venv/
            - backend/.venv
        # Rebuild the image if dependencies change by checking uv.lock
        - action: rebuild
          path: ./backend/uv.lock
    command: /bin/sh -c "uv run fastapi dev --host 0.0.0.0"


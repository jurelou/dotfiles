---
volumes:
  cpp-data-dev:

x-defaults: &defaults
  restart: unless-stopped

services:
  frontend:
    <<: *defaults
    container_name: frontend
    build:
      context: ./frontend
      target: production
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./frontend:/src
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
  backend:
    <<: *defaults
    container_name: backend
    build:
      context: ./backend
      target: production
    ports:
      - 8000:8000